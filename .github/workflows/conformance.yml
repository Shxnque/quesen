name: conformance

# Anti-drift gate (BEA criticism-ledger C-003 / C-004): the offline reference
# evaluator MUST reproduce the published egress/authority conformance fixtures
# byte-for-byte (decision + reason codes + input_snapshot_hash), with NO network.
# The engine repo (Quesen-sib) runs the mirror-image parity test against the same
# fixtures, so engine and public reference are bound to byte-for-byte agreement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline egress/authority conformance (zero network, stdlib only)
        run: python3 evaluation/conformance/verify_conformance.py
